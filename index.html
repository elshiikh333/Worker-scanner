<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منظومة المسح السريع للعقود</title>

    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-green: #10b981;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px 14px 28px;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-main) 60%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 420px; }

    /* الهيدر */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* شريط معلومات العقد والمشرف */
    .role-bar {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .role-badge {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #login-screen {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 26px 20px;
      text-align: center;
      margin-top: 25px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
