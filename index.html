<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منظومة المسح الذكي للعقود</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-green: #10b981;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px 14px 28px;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-main) 60%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 420px; }

    /* الهيدر */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* شريط معلومات العقد والمشرف */
    .role-bar {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .role-badge {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* شاشة تسجيل الدخول بـ PIN */
    #login-screen {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 26px 20px;
      text-align: center;
      margin-top: 25px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    .pin-input {
      width: 100%;
      padding: 14px;
      font-size: 22px;
      letter-spacing: 6px;
      text-align: center;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #38bdf8;
      font-weight: 800;
      outline: none;
      margin: 16px 0;
    }
    .pin-input:focus { border-color: #38bdf8; }
    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
    }

    /* بطاقة العداد */
    .counter-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .counter-info { text-align: right; }
    .counter-title { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .counter-val {
      font-size: 34px;
      font-weight: 900;
      color: var(--accent-green);
      line-height: 1.1;
      text-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
      cursor: pointer;
    }
    .counter-limit {
      background: rgba(245, 158, 11, 0.1);
      border: 1px dashed rgba(245, 158, 11, 0.4);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      color: #fcd34d;
      text-align: center;
    }
    .counter-limit strong { display: block; font-size: 16px; color: #fbbf24; }

    /* إطار الكاميرا */
    .scanner-wrapper {
      position: relative;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.15);
    }
    #reader { width: 100%; border: none !important; }
    #reader video { border-radius: 18px; object-fit: cover; }

    /* خانة الإدخال اليدوي */
    .manual-box {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .manual-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 17px;
      padding: 10px 14px;
      text-align: center;
      font-weight: 600;
    }
    .manual-input::placeholder { color: #64748b; font-size: 14px; }
    .manual-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* بطاقة النتيجة */
    #result-box {
      display: none;
      margin-top: 14px;
      padding: 16px 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .worker-name { font-size: 23px; font-weight: 800; margin: 4px 0 6px; display: block; }
    .bg-green { background: linear-gradient(135deg, #059669, #047857); }
    .bg-red { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    .bg-orange { background: linear-gradient(135deg, #d97706, #b45309); }
    .bg-purple { background: linear-gradient(135deg, #7c3aed, #6d28d9); }

    /* التوقيع */
    .signature {
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    .sig-text { font-size: 13px; color: #94a3b8; font-weight: 500; }
    .sig-name {
      font-size: 14px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span style="font-size: 24px;">⚡</span>
      <h2>منظومة المسح السريع للعقود</h2>
    </div>

    <!-- شاشة الدخول بالكود السري (PIN) -->
    <div id="login-screen">
      <div style="font-size: 38px; margin-bottom: 6px;">🔐</div>
      <h3 style="margin: 0 0 6px; color: #f8fafc;">تسجيل دخول المشرف / الأمن</h3>
      <p style="margin: 0; font-size: 13px; color: #94a3b8;">أدخل الكود السري (PIN) الخاص بعقدك أو البوابة</p>
      <input type="password" inputmode="numeric" id="pinInput" class="pin-input" placeholder="••••" onkeydown="if(event.key==='Enter') loginWithPin()">
      <button class="btn-login" id="loginBtn" onclick="loginWithPin()">دخول للمنظومة</button>
      <div id="login-err" style="color: #f87171; font-size: 14px; margin-top: 10px; display: none; font-weight: bold;"></div>
    </div>

    <!-- واجهة المسح الرئيسية (تظهر بعد الدخول) -->
    <div id="app-screen" style="display: none;">
      <div class="role-bar">
        <span class="role-badge" id="activeRoleName">...</span>
        <button class="btn-logout" onclick="logoutPin()">🔄 تغيير الحساب</button>
      </div>

      <!-- العداد يظهر للمشرفين ويختفي في وضع البوابة -->
      <div class="counter-card" id="counterCard">
        <div class="counter-info">
          <div class="counter-title">العمال المسجلون اليوم</div>
          <div class="counter-val" id="scanCounter" title="انقر مرتين للتصفير اليدوي">0</div>
        </div>
        <div class="counter-limit">
          الهدف اليومي
          <strong id="targetLimit">80 عامل</strong>
        </div>
      </div>

      <div class="scanner-wrapper">
        <div id="reader"></div>
      </div>

      <div class="manual-box">
        <input type="number" id="manualCode" class="manual-input" placeholder="🔢 أدخل كود العامل يدوياً..." onkeydown="if(event.key==='Enter') submitManual()">
        <button class="manual-btn" onclick="submitManual()">تأكيد ➔</button>
      </div>

      <div id="result-box">
        <div id="res-msg" style="font-size: 15px; opacity: 0.95;"></div>
        <span class="worker-name" id="res-name"></span>
        <div id="res-code" style="font-size: 13px; opacity: 0.85;"></div>
      </div>
    </div>

    <div class="signature">
      <span class="sig-text">Powered by</span>
      <span class="sig-name">Meto 🚀</span>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxNOxeoRl1YFT9XWICnA8szEKJ75W1HnEnwp0DgmAXexYCErVjcphIYNMp-7nRt8JXO/exec";

    var activePin = localStorage.getItem('savedPin') || '';
    var activeRole = localStorage.getItem('savedRole') || '';
    var activeName = localStorage.getItem('savedName') || '';
    var activeKey = localStorage.getItem('savedKey') || '';
    var activeLimit = parseInt(localStorage.getItem('savedLimit') || '80', 10);

    var isProcessing = false;
    var scannedCount = 0;
    var html5QrCode = null;

    function getTodayKey() {
      var d = new Date();
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }

    function loadContractCounter() {
      var todayKey = getTodayKey();
      var dateKey = 'date_' + activeKey;
      var countKey = 'count_' + activeKey;

      if (localStorage.getItem(dateKey) === todayKey) {
        scannedCount = parseInt(localStorage.getItem(countKey) || '0', 10);
      } else {
        scannedCount = 0;
        localStorage.setItem(dateKey, todayKey);
        localStorage.setItem(countKey, '0');
      }
      document.getElementById('scanCounter').innerText = scannedCount;
    }

    function incrementContractCounter() {
      var todayKey = getTodayKey();
      var dateKey = 'date_' + activeKey;
      var countKey = 'count_' + activeKey;

      if (localStorage.getItem(dateKey) !== todayKey) {
        scannedCount = 0;
        localStorage.setItem(dateKey, todayKey);
      }
      scannedCount++;
      localStorage.setItem(countKey, scannedCount);
      document.getElementById('scanCounter').innerText = scannedCount;
    }

    // تصفير يدوي بالنقر المزدوج
    document.getElementById('scanCounter').addEventListener('dblclick', function() {
      if (confirm('هل تريد تصفير عداد (' + activeName + ') لليوم؟')) {
        scannedCount = 0;
        localStorage.setItem('date_' + activeKey, getTodayKey());
        localStorage.setItem('count_' + activeKey, '0');
        document.getElementById('scanCounter').innerText = '0';
      }
    });

    function loginWithPin() {
      var pin = document.getElementById('pinInput').value.trim();
      if (!pin) return;

      var btn = document.getElementById('loginBtn');
      var errBox = document.getElementById('login-err');
      btn.innerText = '⏳ جاري التحقق...';
      errBox.style.display = 'none';

      fetch(SCRIPT_URL + '?action=login&pin=' + encodeURIComponent(pin))
        .then(res => res.json())
        .then(res => {
          btn.innerText = 'دخول للمنظومة';
          if (res.status === 'ok') {
            activePin = pin;
            activeRole = res.role;
            activeName = res.name;
            activeKey = res.key;
            activeLimit = res.limit || 80;

            localStorage.setItem('savedPin', activePin);
            localStorage.setItem('savedRole', activeRole);
            localStorage.setItem('savedName', activeName);
            localStorage.setItem('savedKey', activeKey);
            localStorage.setItem('savedLimit', activeLimit);

            showScannerScreen();
          } else {
            errBox.innerText = res.message || '❌ كود غير صحيح!';
            errBox.style.display = 'block';
          }
        })
        .catch(() => {
          btn.innerText = 'دخول للمنظومة';
          errBox.innerText = '❌ تعذر الاتصال بالسيرفر، تأكد من الإنترنت!';
          errBox.style.display = 'block';
        });
    }

    function showScannerScreen() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';

      if (activeRole === 'gate') {
        document.getElementById('activeRoleName').innerText = '🛡️ ' + activeName;
        document.getElementById('counterCard').style.display = 'none';
      } else {
        document.getElementById('activeRoleName').innerText = '📝 مشرف ' + activeName;
        document.getElementById('counterCard').style.display = 'flex';
        document.getElementById('targetLimit').innerText = activeLimit + ' عامل';
        loadContractCounter();
      }

      startCamera();
    }

    function logoutPin() {
      localStorage.removeItem('savedPin');
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
      }
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('pinInput').value = '';
    }

    function startCamera() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 250, height: 250 } },
        function(decodedText) { handleCodeExecution(decodedText); }
      ).catch(err => console.error("Camera error", err));
    }

    function playBeep(freq, duration, type) {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(function() { osc.stop(); ctx.close(); }, duration);
      } catch(e) {}
    }

    function submitManual() {
      var input = document.getElementById('manualCode');
      var code = input.value.trim();
      if (!code) return;
      handleCodeExecution(code);
      input.value = '';
    }

    function handleCodeExecution(code) {
      if (isProcessing) return;
      isProcessing = true;

      var box = document.getElementById('result-box');
      box.style.display = 'block';
      box.className = '';
      box.style.backgroundColor = '#1e293b';
      document.getElementById('res-msg').innerText = '⏳ جاري الفحص والتسجيل...';
      document.getElementById('res-name').innerText = '';
      document.getElementById('res-code').innerText = 'كود: ' + code;

      var targetUrl = SCRIPT_URL + '?code=' + encodeURIComponent(code) + '&pin=' + encodeURIComponent(activePin);

      fetch(targetUrl)
        .then(res => res.json())
        .then(res => {
          document.getElementById('res-msg').innerText = res.message;
          document.getElementById('res-name').innerText = res.workerName || '';

          if (res.status === 'registered_ok' || res.status === 'allowed') {
            if (res.status === 'registered_ok') {
              incrementContractCounter();
            }

            if (activeRole === 'supervisor' && scannedCount >= activeLimit && res.status === 'registered_ok') {
              box.className = 'bg-purple';
              document.getElementById('res-msg').innerText = '🚨 تنبيه: تم الوصول للحد الأقصى (' + activeLimit + ' عامل)!';
              playBeep(1200, 700, 'sawtooth');
              if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
            } else {
              box.className = 'bg-green';
              playBeep(900, 150, 'sine');
            }
          } else if (res.status === 'denied' || res.status === 'not_found') {
            box.className = 'bg-red';
            playBeep(250, 500, 'sawtooth');
            if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
          } else {
            box.className = 'bg-orange';
            playBeep(500, 300, 'square');
            if (navigator.vibrate) navigator.vibrate(300);
          }

          setTimeout(function() {
            isProcessing = false;
            box.style.display = 'none';
          }, 1600);
        })
        .catch(() => {
          box.className = 'bg-red';
          document.getElementById('res-msg').innerText = '❌ خطأ في الاتصال بالسيرفر!';
          setTimeout(function() { isProcessing = false; }, 2000);
        });
    }

    // الدخول التلقائي إذا كان المشرف قد سجل دخوله مسبقاً على هاتفه
    if (activePin && activeRole) {
      showScannerScreen();
    }
  </script>
</body>
</html>
