<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منظومة المسح المزدوج للعقود الأربعة</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.88);
      --border-color: rgba(255, 255, 255, 0.09);
      --accent-green: #10b981;
      --accent-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, system-ui, sans-serif;
      margin: 0;
      padding: 16px 14px 28px;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-main) 65%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 420px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* شاشة تسجيل الدخول */
    #login-screen {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 24px 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .pin-input {
      width: 100%;
      padding: 13px;
      font-size: 24px;
      letter-spacing: 6px;
      text-align: center;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #38bdf8;
      font-weight: 800;
      outline: none;
      margin: 16px 0;
    }
    .pin-input:focus { border-color: #38bdf8; }
    .btn-login {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    /* شريط المستخدم النشط */
    .role-bar {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .role-badge { font-size: 14px; font-weight: 800; color: #38bdf8; }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* كارت العداد */
    .counter-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .counter-val {
      font-size: 34px;
      font-weight: 900;
      color: var(--accent-green);
      line-height: 1.1;
      text-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
      cursor: pointer;
    }
    .stage-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      color: #bae6fd;
      text-align: center;
    }
    .stage-badge strong { display: block; font-size: 14px; color: #38bdf8; margin-top: 2px; }

    /* إطار الكاميرا */
    .scanner-wrapper {
      position: relative;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.5);
    }
    #reader { width: 100%; border: none !important; }
    #reader video { border-radius: 18px; object-fit: cover; }

    /* الإدخال اليدوي */
    .manual-box {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 6px;
    }
    .manual-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      padding: 10px;
      text-align: center;
      font-weight: bold;
    }
    .manual-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* بطاقة النتيجة */
    #result-box {
      display: none;
      margin-top: 14px;
      padding: 16px 18px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .worker-name { font-size: 22px; font-weight: 800; margin: 5px 0; display: block; }
    .contract-pill {
      display: inline-block;
      background: rgba(0, 0, 0, 0.25);
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 4px;
    }
    .bg-green { background: linear-gradient(135deg, #059669, #047857); }
    .bg-blue  { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .bg-red   { background: linear-gradient(135deg, #dc2626, #b91c1c); }
    .bg-orange{ background: linear-gradient(135deg, #d97706, #b45309); }

    .signature {
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    .sig-name {
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span style="font-size: 24px;">⚡</span>
      <h2>منظومة المسح المزدوج للعقود الأربعة</h2>
    </div>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-screen">
      <div style="font-size: 34px; margin-bottom: 6px;">🔐</div>
      <h3 style="margin: 0 0 6px;">دخول الخدمات الإدارية / الأمن</h3>
      <p style="margin: 0; font-size: 13px; color: var(--text-muted);">أدخل الكود السري (PIN) الخاص بك</p>
      <input type="password" inputmode="numeric" id="pinInput" class="pin-input" placeholder="••••" onkeydown="if(event.key==='Enter') loginWithPin()">
      <button class="btn-login" id="loginBtn" onclick="loginWithPin()">دخول للمنظومة</button>
      <div id="login-err" style="color: #f87171; font-size: 14px; margin-top: 10px; display: none; font-weight: bold;"></div>
    </div>

    <!-- 2. شاشة المسح الرئيسية -->
    <div id="app-screen" style="display: none;">
      <div class="role-bar">
        <span class="role-badge" id="activeRoleName">...</span>
        <button class="btn-logout" onclick="logoutPin()">🔄 تغيير الحساب</button>
      </div>

      <div class="counter-card">
        <div style="text-align: right;">
          <div style="font-size: 13px; color: var(--text-muted);" id="counterLabel">إجمالي المسح اليوم</div>
          <div class="counter-val" id="scanCounter" title="انقر مرتين للتصفير اليدوي">0</div>
        </div>
        <div class="stage-badge">
          المرحلة النشطة
          <strong id="stageName">الكل (4 عقود)</strong>
        </div>
      </div>

      <div class="scanner-wrapper">
        <div id="reader"></div>
      </div>

      <div class="manual-box">
        <input type="number" id="manualCode" class="manual-input" placeholder="🔢 أدخل كود العامل يدوياً..." onkeydown="if(event.key==='Enter') submitManual()">
        <button class="manual-btn" onclick="submitManual()">تأكيد ➔</button>
      </div>

      <div id="result-box">
        <div id="res-msg" style="font-size: 15px; font-weight: 600;"></div>
        <span class="worker-name" id="res-name"></span>
        <div id="res-contract" class="contract-pill" style="display: none;"></div>
        <div id="res-code" style="font-size: 12px; opacity: 0.85; margin-top: 4px;"></div>
      </div>
    </div>

    <div class="signature">
      <span style="font-size: 13px; color: #94a3b8;">Powered by</span>
      <span class="sig-name">Meto 🚀</span>
    </div>
  </div>

  <script>
    // الرابط الجديد المُحدث من Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNgDtztPd_HyMbqU5TDbn36Ag2fWDUyv5QOmhJoUjk7J02jZEYz7HuvSNOfVJu7szj/exec";

    const VALID_PINS = ["1111", "2222", "3333", "4444", "9090"];

    var activePin = '';
    var activeRole = '';
    var activeName = '';
    var activeKey = '';
    var isProcessing = false;
    var scannedCount = 0;
    var html5QrCode = null;

    function getTodayKey() {
      var d = new Date();
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }

    function loadCounter() {
      var dateKey = 'date_' + activeKey;
      var countKey = 'count_' + activeKey;
      var today = getTodayKey();

      if (localStorage.getItem(dateKey) === today) {
        scannedCount = parseInt(localStorage.getItem(countKey) || '0', 10);
      } else {
        scannedCount = 0;
        localStorage.setItem(dateKey, today);
        localStorage.setItem(countKey, '0');
      }
      document.getElementById('scanCounter').innerText = scannedCount;
    }

    function incrementCounter() {
      var dateKey = 'date_' + activeKey;
      var countKey = 'count_' + activeKey;
      var today = getTodayKey();

      if (localStorage.getItem(dateKey) !== today) {
        scannedCount = 0;
        localStorage.setItem(dateKey, today);
      }
      scannedCount++;
      localStorage.setItem(countKey, scannedCount);
      document.getElementById('scanCounter').innerText = scannedCount;
    }

    document.getElementById('scanCounter').addEventListener('dblclick', function() {
      if (confirm('هل تريد تصفير عداد (' + activeName + ') لليوم؟')) {
        scannedCount = 0;
        localStorage.setItem('count_' + activeKey, '0');
        document.getElementById('scanCounter').innerText = '0';
      }
    });

    function normalizePinDigits(value) {
      return String(value || '').replace(/[\u0660-\u0669\u06f0-\u06f9]/g, function(digit) {
        var code = digit.charCodeAt(0);
        var zero = code >= 0x06F0 ? 0x06F0 : 0x0660;
        return String(code - zero);
      });
    }

    function loginWithPin() {
      var pin = normalizePinDigits(document.getElementById('pinInput').value).trim();
      if (!pin) return;

      var btn = document.getElementById('loginBtn');
      var err = document.getElementById('login-err');

      if (VALID_PINS.indexOf(pin) === -1) {
        localStorage.removeItem('savedPin');
        err.innerText = '❌ كود الدخول غير صحيح! استخدم الأكواد المعتمدة الجديدة (1111، 2222، 3333، 4444، 9090).';
        err.style.display = 'block';
        return;
      }

      btn.innerText = '⏳ جاري التحقق...';
      err.style.display = 'none';

      fetch(SCRIPT_URL + '?action=login&pin=' + encodeURIComponent(pin) + '&t=' + Date.now())
        .then(res => res.json())
        .then(data => {
          btn.innerText = 'دخول للمنظومة';
          if (data.status === 'ok') {
            activePin = pin;
            activeRole = data.role;
            activeName = data.name;
            activeKey = data.key;

            localStorage.setItem('savedPin', pin);
            showScanner();
          } else {
            localStorage.removeItem('savedPin');
            err.innerText = data.message || '❌ كود الدخول غير مفعل!';
            err.style.display = 'block';
          }
        })
        .catch(() => {
          btn.innerText = 'دخول للمنظومة';
          err.innerText = '❌ تعذر الاتصال بالسيرفر، تأكد من الإنترنت!';
          err.style.display = 'block';
        });
    }

    function showScanner() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';

      if (activeRole === 'security' || activePin === '9090') {
        document.getElementById('activeRoleName').innerText = '🛡️ ' + activeName;
        document.getElementById('counterLabel').innerText = 'حضور مؤكد عبر البوابة اليوم';
        document.getElementById('stageName').innerText = 'المرحلة 2: تأكيد الأمن';
      } else {
        document.getElementById('activeRoleName').innerText = '📋 ' + activeName;
        document.getElementById('counterLabel').innerText = 'مسح إداري أولي اليوم';
        document.getElementById('stageName').innerText = 'المرحلة 1: خدمات إدارية';
      }

      loadCounter();
      startCamera();
    }

    function logoutPin() {
      localStorage.removeItem('savedPin');
      if (html5QrCode) {
        html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
      }
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('pinInput').value = '';
    }

    function startCamera() {
      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 250, height: 250 } },
          function(code) { handleScan(code); }
        ).catch(e => console.error("Camera error:", e));
      } catch(e) {}
    }

    function playBeep(freq, duration, type) {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        osc.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, duration);
      } catch(e) {}
    }

    function submitManual() {
      var input = document.getElementById('manualCode');
      var code = input.value.trim();
      if (!code) return;
      handleScan(code);
      input.value = '';
    }

    function handleScan(code) {
      if (isProcessing) return;
      isProcessing = true;

      var box = document.getElementById('result-box');
      var contractPill = document.getElementById('res-contract');
      box.style.display = 'block';
      box.className = '';
      box.style.backgroundColor = '#1e293b';
      document.getElementById('res-msg').innerText = '⏳ جاري الفحص والتسجيل في ملف العقد...';
      document.getElementById('res-name').innerText = '';
      contractPill.style.display = 'none';
      document.getElementById('res-code').innerText = 'كود العامل: ' + code;

      fetch(SCRIPT_URL + '?code=' + encodeURIComponent(code) + '&pin=' + encodeURIComponent(activePin) + '&t=' + Date.now())
        .then(res => res.json())
        .then(res => {
          document.getElementById('res-msg').innerText = res.message;
          document.getElementById('res-name').innerText = res.workerName || '';

          if (res.contractName) {
            contractPill.innerText = '📂 ' + res.contractName;
            contractPill.style.display = 'inline-block';
          }

          if (res.status === 'registered_ok') {
            incrementCounter();
            box.className = 'bg-blue';
            playBeep(850, 150, 'sine');
          } else if (res.status === 'allowed') {
            incrementCounter();
            box.className = 'bg-green';
            playBeep(1050, 200, 'sine');
          } else if (res.status === 'denied' || res.status === 'not_found' || res.status === 'error') {
            box.className = 'bg-red';
            playBeep(240, 500, 'sawtooth');
            if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
          } else {
            box.className = 'bg-orange';
            playBeep(500, 300, 'square');
            if (navigator.vibrate) navigator.vibrate(250);
          }

          setTimeout(() => {
            isProcessing = false;
            box.style.display = 'none';
          }, 1800);
        })
        .catch(() => {
          box.className = 'bg-red';
          document.getElementById('res-msg').innerText = '❌ خطأ في الاتصال بالسيرفر!';
          setTimeout(() => { isProcessing = false; }, 2000);
        });
    }

    window.addEventListener('load', function() {
      var saved = localStorage.getItem('savedPin');
      if (saved && VALID_PINS.indexOf(saved) !== -1) {
        document.getElementById('pinInput').value = saved;
        loginWithPin();
      } else {
        localStorage.removeItem('savedPin');
      }
    });
  </script>
</body>
</html>
